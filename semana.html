<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una semana conmigo ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0d0d0d;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.caja{
    background:#1b1b1b;
    padding:40px;
    border-radius:20px;
    text-align:center;
    width:360px;
    box-shadow:0 0 30px rgba(255,255,255,.08);
}

h1{
    margin-bottom:15px;
    font-size:30px;
}

.descripcion{
    color:#bdbdbd;
    margin-bottom:25px;
    line-height:1.5;
}

label{
    display:block;
    margin-bottom:10px;
    font-weight:bold;
}

input{
    width:100%;
    padding:15px;
    font-size:22px;
    text-align:center;
    border:none;
    border-radius:10px;
    outline:none;
    letter-spacing:8px;
}

button{
    margin-top:20px;
    width:100%;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:white;
    transition:.3s;
}

button:hover{
    transform:scale(1.03);
}

#error{
    color:#ff5b5b;
    margin-top:15px;
}

#correcto{
    display:none;
}

#correcto h2{
    color:#4ade80;
    margin-bottom:20px;
}

#correcto p{
    color:#d0d0d0;
    line-height:1.6;
    margin-bottom:25px;
}
</style>

</head>
<body>

<div class="caja">

<div id="login">

<h1>❤️ Una semana conmigo ❤️</h1>

<p class="descripcion">
Introduce la fecha que solo tú sabrás para desbloquear el vídeo.
</p>

<label>Fecha Importante</label>

<input
type="password"
id="clave"
maxlength="5"
placeholder="•••••">

<button onclick="entrar()">Desbloquear</button>

<p id="error"></p>

</div>

<div id="correcto">

<h2>❤️ Acceso concedido ❤️</h2>

<p>
Durante estos días no pudimos hablar, así que decidí grabar un poquito de cada día para que,
cuando volvieras, pudieras vivir mi semana conmigo.
Espero que te guste. ❤️
</p>

<button onclick="verVideo()">
▶ Ver vídeo
</button>

</div>

</div>

<script>

function entrar(){

let clave=document.getElementById("clave").value;

if(clave==="21926"){

document.getElementById("login").style.display="none";
document.getElementById("correcto").style.display="block";

}else{

document.getElementById("error").innerHTML="❌ Esa no es la fecha correcta.";

}

}

function verVideo(){

window.location.href="TU_ENLACE_DEL_VIDEO";

}

</script>

</body>
</html>
